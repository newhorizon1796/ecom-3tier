# Placeholder Secret for demo purposes only. In production, do NOT commit
# real secrets to git — use External Secrets Operator, Sealed Secrets, or
# your cloud provider's secret manager, and inject via CI (kubectl create
# secret / helm --set-file) instead.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: ecom
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: changeme-in-production
  # Consumed by the backend Deployment. Must match the two keys above.
  MONGO_URI: "mongodb://admin:changeme-in-production@mongo:27017/ecom?authSource=admin"
