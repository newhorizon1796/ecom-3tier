apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecom
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Substituted by the Jenkins deploy stage (sed) before `kubectl apply`
          # so the applied manifest always carries the real tag — never apply
          # this file as-is, or the placeholder below will be pulled literally.
          image: __FRONTEND_IMAGE__
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
