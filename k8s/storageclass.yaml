# Replaces EKS's default "gp2" StorageClass, which uses the in-tree
# kubernetes.io/aws-ebs provisioner — removed from Kubernetes itself in
# the CSI migration, so it can no longer actually provision volumes.
# Requires the aws-ebs-csi-driver addon (see terraform/eks.tf).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
