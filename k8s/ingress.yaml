# Requires an ingress controller installed in the cluster (e.g. ingress-nginx
# via Helm, or the AWS Load Balancer Controller if you prefer an ALB — swap
# ingressClassName / annotations accordingly).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecom-ingress
  namespace: ecom
  # No rewrite-target: the backend's routes are already mounted at
  # /api/... and the frontend serves everything else at /, so the
  # original request path must reach each service unmodified. A bare
  # `rewrite-target: /` here previously rewrote every request to /,
  # breaking /api/* entirely (backend returned its own 404 for /).
spec:
  ingressClassName: nginx
  rules:
    # No host filter: routes on whatever hostname reaches the load
    # balancer (its own AWS-assigned DNS name, or a real domain once
    # one is pointed at it via a CNAME). Add `host:` back once you
    # own a domain for this.
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
